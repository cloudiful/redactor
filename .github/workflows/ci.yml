name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run crate tests
        run: cargo test --manifest-path crates/redactor/Cargo.toml

      - name: Run feature-gated crate tests
        run: cargo test --manifest-path crates/redactor/Cargo.toml --all-features
