openapi: 3.1.0
info:
  title: Redactor HTTP API
  description: Structured text redaction, permit-scoped restoration, and authenticated session inspection.
  version: 0.4.0
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /inspect/session:
    post:
      operationId: inspect_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectSessionRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /redact/text:
    post:
      operationId: redact_text
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedactTextRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactTextResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /restore/text:
    post:
      operationId: restore_text
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreTextRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CustomFileRule:
      type: object
      required:
      - path
      properties:
        path:
          type: string
    CustomStringMatch:
      type: string
      enum:
      - exact
      - contains
      - regex
    CustomStringRule:
      type: object
      required:
      - pattern
      properties:
        match_type:
          $ref: '#/components/schemas/CustomStringMatch'
        pattern:
          type: string
        scope:
          $ref: '#/components/schemas/CustomStringScope'
    CustomStringScope:
      type: string
      enum:
      - text
      - line
    ErrorEnvelope:
      type: object
      required:
      - message
      - kind
      properties:
        kind:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
    FindingKind:
      type: string
      enum:
      - secret
      - domain
      - url
      - email
      - ip
      - cidr
      - phone
      - person
      - organization
      - custom_string
      - custom_file
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
    InputKind:
      type: string
      enum:
      - text
      - git_diff
    InspectSessionRequest:
      type: object
      required:
      - encrypted_session
      properties:
        encrypted_session:
          type: string
      additionalProperties: false
    RedactTextRequest:
      type: object
      required:
      - text
      properties:
        external_id:
          type:
          - string
          - 'null'
        input_kind:
          $ref: '#/components/schemas/InputKind'
        redaction:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RedactionPolicy'
        source_path:
          type:
          - string
          - 'null'
        text:
          type: string
      additionalProperties: false
    RedactTextResponse:
      type: object
      required:
      - redacted_text
      - encrypted_session
      - restore_permit
      - session_summary
      properties:
        encrypted_session:
          type: string
        redacted_text:
          type: string
        restore_permit:
          type: string
        session_summary:
          $ref: '#/components/schemas/SessionSummary'
    RedactionPolicy:
      allOf:
      - $ref: '#/components/schemas/RedactionRules'
      - type: object
        properties:
          custom_files:
            type: array
            items:
              $ref: '#/components/schemas/CustomFileRule'
          custom_strings:
            type: array
            items:
              $ref: '#/components/schemas/CustomStringRule'
    RedactionRules:
      type: object
      properties:
        cidr:
          type: boolean
          default: true
        domain:
          type: boolean
          default: false
        email:
          type: boolean
          default: true
        ip:
          type: boolean
          default: true
        organization:
          type: boolean
          default: false
        person:
          type: boolean
          default: false
        phone:
          type: boolean
          default: false
        secret:
          type: boolean
          default: false
        url:
          type: boolean
          default: false
    RestoreResult:
      type: object
      required:
      - restored_text
      - restored_count
      - skipped_tokens
      - unresolved_tokens
      - validation_errors
      properties:
        restored_count:
          type: integer
          minimum: 0
        restored_text:
          type: string
        skipped_tokens:
          type: array
          items:
            type: string
        unresolved_tokens:
          type: array
          items:
            type: string
        validation_errors:
          type: array
          items:
            type: string
    RestoreTextRequest:
      type: object
      required:
      - text
      - restore_permits
      properties:
        encrypted_session:
          type:
          - string
          - 'null'
        external_id:
          type:
          - string
          - 'null'
        restore_permits:
          type: array
          items:
            type: string
        text:
          type: string
      additionalProperties: false
    SessionEntrySummary:
      type: object
      required:
      - token
      - kind
      - occurrences
      properties:
        kind:
          $ref: '#/components/schemas/FindingKind'
        occurrences:
          type: integer
          minimum: 0
        replacement_hint:
          type:
          - string
          - 'null'
        token:
          type: string
    SessionSummary:
      type: object
      required:
      - version
      - session_id
      - scope_id
      - fingerprint
      - redacted_fingerprint
      - entry_count
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SessionEntrySummary'
        entry_count:
          type: integer
          minimum: 0
        external_id:
          type:
          - string
          - 'null'
        fingerprint:
          type: string
        redacted_fingerprint:
          type: string
        scope_id:
          type: string
        session_id:
          type: string
        version:
          type: integer
          format: int32
          minimum: 0
