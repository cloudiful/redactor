name: CI and Publish Kellnr

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run crate tests
        run: cargo test --manifest-path crates/redactor/Cargo.toml

      - name: Run feature-gated crate tests
        run: cargo test --manifest-path crates/redactor/Cargo.toml --all-features

  publish-kellnr:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Verify package contents
        run: cargo package --manifest-path crates/redactor/Cargo.toml --allow-dirty

      - name: Publish Crate To Kellnr
        run: |
          if [ -z "$CARGO_REGISTRIES_KELLNR_TOKEN" ]; then
            echo "Missing secret: KELLNR_TOKEN"
            exit 1
          fi
          cargo publish --manifest-path crates/redactor/Cargo.toml --registry kellnr
