[package]
name = "redactor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive"] }
hex = "0.4.3"
ipnet = "2.11.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
url = "2.5.7"

[dependencies.reqwest]
version = "0.12.24"
optional = true
default-features = false
features = ["blocking", "json", "rustls-tls"]

[features]
default = []
ollama = ["dep:reqwest"]
